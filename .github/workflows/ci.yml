name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chateau_base_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chateau_base_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/chateau_base_ci
      API_HOST: 127.0.0.1
      API_PORT: "4000"
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_CHATEAU_API_BASE_URL: http://127.0.0.1:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@11.3.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @chateau/db exec prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma client
        run: pnpm --filter @chateau/db prisma:generate

      - name: Apply migrations
        run: pnpm --filter @chateau/db exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Seed database
        run: pnpm --filter @chateau/db prisma:seed

      - name: DB-backed smoke
        run: pnpm --filter @chateau/api smoke:db

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check whitespace
        run: git diff --check

      - name: Guard next-env
        run: |
          if grep -n "\.next" apps/web/next-env.d.ts; then
            echo "apps/web/next-env.d.ts must not reference .next generated routes"
            exit 1
          fi
